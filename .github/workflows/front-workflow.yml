name: FRONT-WORKFLOW
on:
  push:
    branches: [ "dev" ]
jobs:
  front-job:
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd /home/ubuntu/moodbook-frontend
            
            echo "SSH 접속"
            echo "환경 설정 파일 생성"
            echo -e "VITE_REST_SERVER=${{ secrets.REST_SERVER }}" >> .env

            echo "Checking Git repository..."
            git_output=$(sudo git pull origin dev 2>&1) || { echo "Git pull failed"; echo "$git_output"; exit 1; }
            echo "$git_output"
            
            docker compose up -d --build

      - name: 디스코드 성공 알림 전송
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content":"🚀 `FRONTEND : ${{ github.ref_name }}`에 빌드 성공, EC2에 배포 완료!"}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
               
      - name: 디스코드 실패 알림 전송
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content":"🚀 `FRONTEND : ${{ github.ref_name }}` 빌드 실패. 로그 확인 필요."}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
