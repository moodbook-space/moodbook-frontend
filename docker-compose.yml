version: '3'
services:
  front:
    build: 
      context: .
    container_name: moodbook-frontend
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/moodbook.live/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/moodbook.live/privkey.pem:/etc/ssl/private/privkey.pem:ro